<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="login page" />
    <title>Reset password - 9.5 AI CLUB</title>
    <!-- Khởi tạo Theme chống chớp trắng (FOUC) -->
    <meta name="theme-color" content="#f5f8ff" />
    <meta name="color-scheme" content="light dark" />
    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/theme-tokens.css" />
    <link rel="stylesheet" href="/css/reset_pass.css" />
    <link rel="icon" type="image/png" href="/assets/icon/favicon-32.png" />
</head>

<body>
    <main class="main">

        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Logo + tiêu đề slogan -->
            <a href="../../home_page/home_page.html" class="sidebar-brand">
                <span class="brand-logo"></span>
                <div class="brand-text">
                    <strong>9.5 AI CLUB</strong>
                    <small>Learn · Build · Grow</small>
                </div>
            </a>

            <!-- Welcome back -->
            <h2 class="welcome">Welcome back,<br>to <span class="highlight">9.5 AI CLUB!</span></h2>
            <p class="slogan">Continue your learning journey and achieve your goals.</p>

            <!-- advantage -->
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="#" class="nav-link">
                            <span class="nav-icon access-icon"></span>
                            <span class="nav-label">Acess quality learning resources</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <span class="nav-icon progress-icon"></span>
                            <span class="nav-label">Track your progress</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <span class="nav-icon future-icon"></span>
                            <span class="nav-label">Build a better future</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>





        <!--lsign up-->
        <section class="card auth-card" aria-labelledby="login-title">
            <h2 class="auth-title" id="login-title">Create new password</h2>
            <p class="auth-subtitle">Enter your new password.</p>

            <form class="auth-form" action="#" method="post" novalidate>

                <!-- nhập Password -->
                <div class="input-container">
                    <span class="icon-left password-icon"></span>
                    <div class="input-content">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <button type="button" class="btn-toggle-password"></button>

                    <!-- nút ẩn/hiện mật khẩu -->
                    <button type="button" class="btn-toggle-password" id="togglePassword">
                        <!-- SVG Mắt mở mặc định -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- nhập lại Password -->
                <div class="input-container">
                    <span class="icon-left password-icon"></span>
                    <div class="input-content">
                        <label for="password">Confirm Password</label>
                        <input type="password" id="password" name="password" placeholder="Confirm your password"
                            required>
                    </div>
                    <button type="button" class="btn-toggle-password"></button>

                    <!-- nút ẩn/hiện mật khẩu -->
                    <button type="button" class="btn-toggle-password" id="togglePassword">
                        <!-- SVG Mắt mở mặc định -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Nút Log in -->
                <button type="submit" class="btn-login">
                    Reset password
                    <span class="icon-arrow">→</span>
                </button>
            </form>

            <p class="auth-note">
                <a href="login.html" class="signup-link">← Back to login</a>
            </p>
        </section>
    </main>
    <script src="/js/signup.js"></script>
    <script src="../../js/syncProfile.js"></script>
</body>

</html>
