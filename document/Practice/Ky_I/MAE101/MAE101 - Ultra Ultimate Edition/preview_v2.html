<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f43f5e">
  <title>MAE101 - Xem thử 20 câu LaTeX (v2)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Styling for LaTeX preview and explanation components */
    .latex-question-box {
      font-size: 17px;
      line-height: 1.65;
      padding: 20px 24px;
      background: var(--surface-muted);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      margin-top: 14px;
    }
    .latex-options {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    .latex-option-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .12s ease;
      text-align: left;
      font-size: 15px;
    }
    .latex-option-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .latex-option-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    .latex-option-card.correct {
      border-color: var(--good);
      background: var(--good-soft);
      color: var(--good);
      font-weight: 700;
    }
    .latex-option-card.wrong {
      border-color: var(--bad);
      background: var(--bad-soft);
      color: var(--bad);
    }
    .option-badge {
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-muted);
      font-weight: 900;
      font-size: 14px;
    }
    .latex-option-card.selected .option-badge {
      background: var(--accent);
      color: white;
    }
    .latex-option-card.correct .option-badge {
      background: var(--good);
      color: white;
    }
    .latex-option-card.wrong .option-badge {
      background: var(--bad);
      color: white;
    }
    .option-math {
      flex: 1;
      overflow-x: auto;
    }
    .explanation-panel {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }
    .explanation-toggle {
      width: 100%;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      background: var(--surface-soft);
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      color: var(--accent-strong);
    }
    .explanation-content {
      padding: 18px 22px;
      font-size: 15px;
      line-height: 1.7;
    }
    .explanation-step {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--line);
    }
    .explanation-step:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .orig-image-toggle {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .orig-image-toggle:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .orig-image-container {
      margin-top: 14px;
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-md);
      background: white;
      text-align: center;
    }
    .orig-image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .status-pill.verified {
      background: var(--good-soft);
      color: var(--good);
    }
    .status-pill.conflict {
      background: var(--warn-soft);
      color: var(--warn);
    }
    .status-pill.needs-image {
      background: var(--accent-soft);
      color: var(--accent);
    }
    mjx-container[jax="SVG"] {
      display: inline-block;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      vertical-align: middle;
    }
    mjx-container[jax="SVG"][display="true"] {
      display: block;
      text-align: center;
      margin: 0.85rem 0;
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: false,
        processEnvironments: true
      },
      svg: {
        fontCache: 'global'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="vendor/mathjax/tex-svg.js"></script>
</head>

        } else if (name === 'test_20') {

          }
        } else if (name === 'all_v2') {
          if (Array.isArray(window.MAE_QUESTIONS_V2)) {
            questions = window.MAE_QUESTIONS_V2.filter(q => q.question);
          }
        }
        currentIndex = 0;
        selectedAnswers = {};
        checkedAnswers = {};
        renderCurrent();
      }

      loadDataset('all_v2');
      $('datasetSelector').addEventListener('change', (e) => {
        loadDataset(e.target.value);
      });

      function showToast(msg) {
        const toast = $('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function applyTheme(theme) {
        const val = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = val;
        localStorage.setItem('mae101_preview_theme', val);
        $('themeBtn').firstChild.textContent = val === 'dark' ? '☀' : '☾';
      }

      $('themeBtn').addEventListener('click', () => {
        const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(cur);
      });
      applyTheme(localStorage.getItem('mae101_preview_theme') || 'light');

      function renderNavGrid() {
        $('questionGrid').innerHTML = questions.map((q, idx) => {
          const classes = ['question-jump'];
          if (idx === currentIndex) classes.push('current');
          if (checkedAnswers[q.id]) classes.push('answered');
          return `<button type="button" class="${classes.join(' ')}" data-index="${idx}">${idx + 1}</button>`;
        }).join('');

        $$('.question-jump').forEach(btn => {
          btn.addEventListener('click', () => {
            currentIndex = Number(btn.dataset.index);
            renderCurrent();
          });
        });
      }

      async function renderCurrent() {
        const q = questions[currentIndex];
        if (!q) return;

        $('positionStat').textContent = `${currentIndex + 1}/${questions.length}`;
        $('progressBar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
        $('questionNumber').textContent = `Câu ${currentIndex + 1} (Gốc #${q.id})`;
        $('questionTopic').textContent = `${q.folder} · ${q.topic}`;

        // Status badges
        const statusEl = $('questionStatus');
        statusEl.className = `status-pill ${q.answer_status}`;
        statusEl.textContent = q.answer_status === 'verified' ? '✓ Đã kiểm chứng' : '⚠️ Cần đối chiếu';

        const needsImgEl = $('needsImageBadge');
        needsImgEl.classList.toggle('hidden', !q.needs_image);

        // Render question text
        const qBox = $('latexQuestion');
        qBox.innerHTML = q.question.replace(/\n/g, '<br>');

        // Render image
        $('origImage').src = `assets/questions/${encodeURIComponent(q.image)}`;
        if (q.needs_image) {
          showOrigImage = true;
        }
        $('origImageContainer').classList.toggle('hidden', !showOrigImage);
        $('toggleOrigImageText').textContent = showOrigImage ? 'Ẩn ảnh gốc' : 'Xem ảnh gốc để đối chiếu';

        // Render options
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        const selected = selectedAnswers[q.id] || '';
        const isChecked = Boolean(checkedAnswers[q.id]);

        $('latexOptions').innerHTML = q.options.map((optText, optIdx) => {
          const letter = letters[optIdx];
          const classes = ['latex-option-card'];
          if (selected === letter) classes.push('selected');
          if (isChecked && q.answer === letter) classes.push('correct');
          if (isChecked && selected === letter && q.answer !== letter) classes.push('wrong');

          return `
            <div class="${classes.join(' ')}" data-letter="${letter}">
              <div class="option-badge">${letter}</div>
              <div class="option-math">${optText}</div>
            </div>
          `;
        }).join('');

        $$('.latex-option-card').forEach(card => {
          card.addEventListener('click', () => {
            if (checkedAnswers[q.id]) return;
            selectedAnswers[q.id] = card.dataset.letter;
            renderCurrent();
          });
        });

        // Feedback
        const feedback = $('answerFeedback');
        if (isChecked) {
          const isCorrect = selected === q.answer;
          feedback.className = `answer-feedback ${isCorrect ? 'good' : 'bad'}`;
          feedback.innerHTML = isCorrect
            ? `✓ <strong>Chính xác!</strong> Đáp án đúng là <strong>${q.answer}</strong>.`
            : `✕ <strong>Chưa đúng!</strong> Bạn chọn <strong>${selected || 'Chưa chọn'}</strong>, đáp án đúng là <strong>${q.answer}</strong>.`;
        } else {
          feedback.className = 'answer-feedback hidden';
          feedback.innerHTML = '';
        }

        // Explanation
        const expContent = $('explanationContent');
        expContent.innerHTML = q.explanation.map(step => `
          <div class="explanation-step">${step.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
        `).join('');

        $('explanationContent').classList.toggle('hidden', !showExplanation);
        $('explanationArrow').textContent = showExplanation ? '▲' : '▼';

        // Prev/Next buttons
        $('prevBtn').disabled = currentIndex === 0;
        $('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Hết danh sách' : 'Câu sau →';

        renderNavGrid();

        // Typeset MathJax on the modified elements
        if (window.MathJax && window.MathJax.typesetPromise) {
          try {
            await MathJax.typesetPromise([qBox, $('latexOptions'), expContent]);
          } catch (err) {
            console.error('MathJax typeset error:', err);
          }
        }
      }

      // Event listeners
      $('toggleOrigImageBtn').addEventListener('click', () => {
        showOrigImage = !showOrigImage;
        $('origImageContainer').classList.toggle('hidden', !showOrigImage);
        $('toggleOrigImageText').textContent = showOrigImage ? 'Ẩn ảnh gốc' : 'Xem ảnh gốc để đối chiếu';
      });

      $('toggleExplanationBtn').addEventListener('click', () => {
        showExplanation = !showExplanation;
        $('explanationContent').classList.toggle('hidden', !showExplanation);
        $('explanationArrow').textContent = showExplanation ? '▲' : '▼';
      });

      $('checkBtn').addEventListener('click', () => {
        const q = questions[currentIndex];
        if (!selectedAnswers[q.id]) {
          showToast('Vui lòng chọn một đáp án trước khi kiểm tra.');
          return;
        }
        checkedAnswers[q.id] = true;
        showExplanation = true;
        renderCurrent();
      });

      $('prevBtn').addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderCurrent();
        }
      });

      $('nextBtn').addEventListener('click', () => {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          renderCurrent();
        }
      });

      document.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D', 'E', 'F'].includes(key)) {
          const q = questions[currentIndex];
          if (!checkedAnswers[q.id]) {
            selectedAnswers[q.id] = key;
            renderCurrent();
          }
        } else if (e.key === 'ArrowRight' || key === 'N') {
          if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderCurrent();
          }
        } else if (e.key === 'ArrowLeft' || key === 'P') {
          if (currentIndex > 0) {
            currentIndex--;
            renderCurrent();
          }
        } else if (e.key === 'Enter') {
          $('checkBtn').click();
        }
      });

      renderCurrent();
    })();
  </script>
</body>
</html>
